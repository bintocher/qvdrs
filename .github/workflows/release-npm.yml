name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm install

      - name: Build native module
        run: npx napi build --features napi_support --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.2.2

      - name: Install dependencies
        run: npm install

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Move artifacts to platform packages
        shell: pwsh
        run: |
          $targets = @{
            'x86_64-pc-windows-msvc' = 'win32-x64-msvc'
            'x86_64-unknown-linux-gnu' = 'linux-x64-gnu'
            'aarch64-unknown-linux-gnu' = 'linux-arm64-gnu'
            'x86_64-apple-darwin' = 'darwin-x64'
            'aarch64-apple-darwin' = 'darwin-arm64'
          }
          foreach ($target in $targets.Keys) {
            $files = @(Get-ChildItem "artifacts/bindings-$target/*.node")
            if ($files.Count -ne 1) { throw "Expected one binding for $target" }
            $platform = $targets[$target]
            Copy-Item -LiteralPath $files[0].FullName -Destination "npm/$platform/qvdrs.$platform.node"
          }

      - name: Test native package
        run: node -e "const q=require('./npm/linux-x64-gnu'); const i=q.JsExistsIndex.fromValues(['a','b']); if(i.len!==2 || !i.exists('a') || i.exists('c')) throw Error('Native package failed');"

      - name: Publish platform packages, then main package
        run: node .github/scripts/publish-npm.cjs
